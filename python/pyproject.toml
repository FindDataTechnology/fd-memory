[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yongyi-agent"
version = "0.1.1"
description = "Memory adapter for agent frameworks: captures turns and tool calls into a fd-memory (永忆) service"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FindData Technology" }]
keywords = ["memory", "agents", "mcp", "langchain", "crewai", "llamaindex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
# Core is stdlib-only on purpose: installing a memory adapter must not drag in
# an HTTP stack. Framework support is opt-in through the extras below.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.100"]
llamaindex = ["llama-index-core>=0.11"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/finddata/fd-memory"

[tool.setuptools.packages.find]
include = ["yongyi_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
